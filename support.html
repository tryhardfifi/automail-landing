<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Auto Mail</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    .legal-content { line-height: 1.8; }
    .legal-content h2 { scroll-margin-top: 2rem; }
    .legal-content a { text-decoration: underline; }
    .contact-form { max-width: 600px; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .form-group textarea { resize: vertical; min-height: 150px; }
    .submit-btn {
      background-color: #3b82f6;
      color: white;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover { background-color: #2563eb; }
  </style>
</head>
<body class="bg-white">
  <!-- Header -->
  <header class="py-6 px-4 border-b">
    <div class="max-w-4xl mx-auto">
      <a href="/" class="text-2xl font-bold text-gray-900 hover:text-gray-700">Auto Mail</a>
    </div>
  </header>

  <!-- Content -->
  <main class="py-12 px-4">
    <div class="max-w-4xl mx-auto legal-content">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Support</h1>
      <p class="text-gray-600 mb-12">We're here to help</p>

      <div class="space-y-12">
        <!-- Contact Form Section -->
        <section>
          <h2 class="text-2xl font-semibold mb-6">Contact Form</h2>
          <form class="contact-form">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" required>
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </section>

        <!-- Privacy Contact Section -->
        <section>
          <h2 class="text-2xl font-semibold mb-4">Data Privacy & Deletion</h2>
          <div class="bg-gray-50 p-6 rounded-lg">
            <p class="text-gray-700">
              Contact <a href="mailto:filippo@mobileoperator.com">filippo@mobileoperator.com</a> to talk about deleting your data / privacy.
            </p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 px-4 border-t mt-12">
    <div class="max-w-4xl mx-auto text-center">
      <div class="flex flex-wrap justify-center gap-4 sm:gap-8 text-sm text-gray-600 mb-4">
        <a href="/" class="hover:text-gray-900">Home</a>
        <a href="/privacy.html" class="hover:text-gray-900">Privacy Policy</a>
        <a href="/terms.html" class="hover:text-gray-900">Terms & Conditions</a>
        <a href="/support.html" class="hover:text-gray-900">Support</a>
      </div>
      <p class="text-sm text-gray-500">&copy; 2026 Auto Mail. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
